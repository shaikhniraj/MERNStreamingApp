{{/* One ClusterIP Service per entry in .Values.services — internal-only,
     stable DNS names other pods (and later, Ingress) route to. */}}
{{- range .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  # Fixed naming (not release-prefixed) so it matches the exact service
  # names your assignment's Ingress routing table specifies: auth-svc, etc.
  name: {{ .name }}-svc
spec:
  selector:
    app: {{ .name }}
  ports:
    - port: {{ .port }}
      targetPort: {{ .port }}
{{- end }}