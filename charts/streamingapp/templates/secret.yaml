# templates/secret.yaml
# Holds sensitive values: the JWT signing key and AWS credentials used for S3 access.

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "streamingapp.fullname" . }}-secret
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | quote }}