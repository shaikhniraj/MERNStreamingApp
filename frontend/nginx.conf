server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routes (e.g. /admin, /browse) have no matching
    # file on disk — fall back to index.html so the SPA router can handle them.
    location / {
        try_files $uri /index.html;
    }
}
